server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # No servir archivos internos del proyecto.
    # Va antes que "location ~ \.php$" porque nginx usa la primera regex que coincide.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(sql|docs|docker|config|dao|modelos|controllers|helpers|views)/ { deny all; }
    location ~ \.(md|yml|sql)$ { deny all; }

    # Todas las rutas van por index.php (?controller=x&action=y)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
